<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MedNotesIN</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

<header>
    <h1>MedNotesIN</h1>
    <p>Your Simple Medical Notes App (Auto Save Enabled)</p>
</header>

<div class="container">

    <div class="card">
        <h2>Add New Note</h2>

        <input type="text" id="title" placeholder="Enter title">

        <textarea id="content" rows="5" placeholder="Enter note content"></textarea>

        <button onclick="addNote()">Add Note</button>
    </div>

    <div id="notesContainer"></div>

</div>

<script src="data.js"></script>
<script src="script.js"></script>

</body>
</html>
